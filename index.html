            <script>
                Date.prototype.format = function (fmt) {
                    var o = {
                        "y+": this.getFullYear(),
                        "M+": this.getMonth() + 1,
                        "d+": this.getDate(),
                        "h+": this.getHours(),
                        "m+": this.getMinutes(),
                        "s+": this.getSeconds(),
                    };
                    if (/(y+)/.test(fmt)) fmt = fmt.replace(RegExp.$1, (this.getFullYear() + "").substr(4 - RegExp.$1.length));
                    for (var k in o)
                        if (new RegExp("(" + k + ")").test(fmt)) fmt = fmt.replace(RegExp.$1, (RegExp.$1.length == 1) ? (o[k]) : (("00" + o[k]).substr(("" + o[k]).length)));
                    return fmt;
                }

                setInterval(function () {
                    const dt = document.getElementById('dateTime00');
                    if (dt) {
                        dt.innerHTML = (new Date()).format('yyyy-M-d hh:mm:ss');
                    }
                }, 1000);
            </script>

            <div id="dateTime3">00:00</div>

            <script>
    // Cập nhật giờ hệ thống (Dòng trên mã QR)
    function updateClock() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('current-time').textContent = `${y}-${m}-${d} ${hh}:${mm}:${ss}`;
    }

    // Logic đếm tăng (Count-up) - Tự động reset sau 12 tiếng
    let startTime = localStorage.getItem("qrStartTimeCounter");
    if (!startTime) {
        startTime = Date.now();
        localStorage.setItem("qrStartTimeCounter", startTime);
    } else {
        startTime = parseInt(startTime);
    }

    function updateTimer() {
        let now = Date.now();
        let diffInSecs = Math.floor((now - startTime) / 1000);
        
        // Reset sau 12 tiếng (43200 giây)
        if (diffInSecs >= 43200) {
            startTime = Date.now();
            localStorage.setItem("qrStartTimeCounter", startTime);
            diffInSecs = 0;
        }

        const hrs = Math.floor(diffInSecs / 3600);
        const mins = Math.floor((diffInSecs % 3600) / 60);
        const secs = diffInSecs % 60;

        let display = hrs > 0 
            ? `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`
            : `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        
        document.getElementById('timer-up').textContent = display;
    }

    setInterval(updateClock, 1000);
    setInterval(updateTimer, 1000);
    updateClock();
    updateTimer();
</script>
